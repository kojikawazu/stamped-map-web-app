name: CI

# 作業ブランチは PR でのみ実行する（push にも作業ブランチを並べると同じ内容が 2 回走る）。
# push は main（マージ後の検証）だけに絞る。
on:
  push:
    branches:
      - main
    paths:
      - "front/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "front/**"
      - ".github/workflows/ci.yml"

# 同一 PR への連続 push では古い実行をキャンセルする（it / e2e は重量ジョブのため積み上げない）。
# main への push はマージごとの検証結果を残すため、キャンセルせず順に完走させる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型チェックは @prisma/client の型に依存する（IT ファイルが PrismaClient を import）。
      # install の build script 依存は非決定的なため、明示的に生成する。
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_KEY: dummy-anon-key
          NUXT_PUBLIC_MAPTILER_KEY: dummy-maptiler-key

      - name: Type check
        run: pnpm type-check
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_KEY: dummy-anon-key
          NUXT_PUBLIC_MAPTILER_KEY: dummy-maptiler-key

      - name: Lint (ESLint / JSDoc)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      # カバレッジ付きで実行する。vitest.config.ts の thresholds を下回ると
      # このステップが失敗し、testing.md のカバレッジ目安が CI ゲートとして機能する。
      - name: Unit tests (mocked) + coverage
        run: pnpm test:coverage
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_KEY: dummy-anon-key
          NUXT_PUBLIC_MAPTILER_KEY: dummy-maptiler-key

  it:
    name: Integration tests (real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # IT は実 @prisma/client を使うため生成が必須（ユニットは prisma をモックするため不要）
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # Testcontainers が PostGIS コンテナを起動し db push → 実 DB でハンドラを検証する。
      # ubuntu-latest には Docker が同梱されているため services 定義は不要。
      - name: Integration tests (Testcontainers + PostGIS)
        run: pnpm test:it

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: front

    # 実 DB シナリオ E2E 用の PostGIS サービス（schema が postgis 拡張を要求するため）。
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stamped_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # サーバー・ビルド・DB 準備で共有する環境変数。
    # DB はテスト専用の TEST_DATABASE_URL で渡す（DATABASE_URL をジョブ全体に置かない。testing.md）。
    # DB 準備スクリプトは front/lib/test-database-url.ts の接続先ガード（localhost 系のみ許可）を通る。
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stamped_e2e
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_KEY: dummy-anon-key
      NUXT_PUBLIC_MAPTILER_KEY: dummy-maptiler-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build Nuxt
        run: pnpm build

      # schema を実 DB に同期し、決定的なシード（デフォルト5カテゴリ + ダミー5スポット）を投入する。
      - name: Prepare test database
        run: pnpm db:setup:test

      # 本番ビルド済みサーバーを実 DB + E2E 認証バイパスで起動する。
      # E2E_AUTH_BYPASS は本番では絶対に設定しない（VERCEL_ENV=production でも無効化される二重ガード）。
      - name: Start production server
        run: |
          PORT=3000 HOST=0.0.0.0 \
          DATABASE_URL="$TEST_DATABASE_URL" \
          DIRECT_URL="$TEST_DATABASE_URL" \
          E2E_AUTH_BYPASS=1 \
          ALLOWED_EMAILS=e2e@example.com \
          node .output/server/index.mjs > /tmp/nitro.log 2>&1 &

      - name: Wait for production server
        run: |
          timeout 30 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 | grep -qE "^[2345]"; do sleep 1; done' \
            || (echo "=== nitro.log ===" && cat /tmp/nitro.log && exit 1)

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7
