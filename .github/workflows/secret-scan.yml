name: Secret scan

# 鍵・.env 系の秘匿ファイルが Git 管理下に入っていないかを検査する。
# どの分類の変更でも混入しうるため、paths / paths-ignore で絞らず常に実行する。
# （ワークフローレベルで止めると、必須チェックに含めた際に pending のまま PR がマージできなくなる）
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 検出パターンの退行（静かな検出漏れ）を本検査の前に落とす
      - name: Self-test detection patterns
        run: bash scripts/test-check-tracked-secrets.sh

      # git ls-files はインデックスを読むだけなので、履歴・ワーキングツリーを走査せず数秒で終わる
      - name: Assert no secret files are tracked
        run: bash scripts/check-tracked-secrets.sh
